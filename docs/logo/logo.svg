<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: bold; font-size: 90px; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 300; font-size: 32px; fill: #800020; letter-spacing: 5px; text-transform: uppercase; }
      .node { fill: #3498db; }
      .hub { fill: #800020; }
      .link { stroke: #bdc3c7; stroke-width: 2; }
      .pulse { fill: #3498db; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <!-- Graphic Section -->
  <g transform="translate(100, 100)">
    <!-- Links -->
    <line x1="0" y1="0" x2="-60" y2="-50" class="link" />
    <line x1="0" y1="0" x2="-60" y2="50" class="link" />
    <line x1="0" y1="0" x2="60" y2="0" class="link" />

    <!-- Nodes -->
    <circle cx="-60" cy="-50" r="8" class="node" opacity="0.8"/>
    <circle cx="-60" cy="50" r="8" class="node" opacity="0.8"/>
    <circle cx="60" cy="0" r="8" class="node" opacity="0.8"/>

    <!-- Central Hub -->
    <circle cx="0" cy="0" r="14" class="hub" />

    <!-- Animations -->
    <!-- Packet 1: Incoming -->
    <circle r="5" class="pulse" fill="#800020">
      <animateMotion dur="2s" repeatCount="indefinite" path="M-60,-50 L0,0" keyPoints="0;1" keyTimes="0;1" calcMode="linear" />
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Packet 2: Incoming -->
    <circle r="5" class="pulse" fill="#800020">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M-60,50 L0,0" keyPoints="0;1" keyTimes="0;1" calcMode="linear" />
      <animate attributeName="opacity" values="1;0" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Packet 3: Outgoing -->
    <circle r="5" class="pulse" fill="#3498db">
       <animateMotion dur="1.5s" begin="0.5s" repeatCount="indefinite" path="M0,0 L60,0" keyPoints="0;1" keyTimes="0;1" calcMode="linear" />
       <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Text Section -->
  <text x="220" y="95" class="title">MCP</text>
  <text x="225" y="145" class="subtitle">Next Generation</text>

  <!-- Accent Line -->
  <line x1="220" y1="110" x2="650" y2="110" stroke="#3498db" stroke-width="3" />
</svg>
