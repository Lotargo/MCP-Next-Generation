[tool.poetry]
name = "fastapi-calculator-tool"
version = "0.1.0"
description = "A calculator tool (formerly FastAPI) that uses gRPC."
authors = ["Lotargo"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
grpcio = "^1.64.1"
protobuf = "~6.31"
mcp-shared-proto-py = {path = "../../../../mcp-shared-proto-py", develop = true}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
